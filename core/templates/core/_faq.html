{% comment %}Accordéon Bootstrap de questions-réponses. Variables : questions, identifiant (unique dans la page).{% endcomment %}
<div class="accordion accordeon-faq" id="{{ identifiant }}">
  {% for question in questions %}
  <div class="accordion-item">
    <h3 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
              data-bs-target="#{{ identifiant }}-{{ forloop.counter }}" aria-expanded="false"
              aria-controls="{{ identifiant }}-{{ forloop.counter }}">{{ question.question }}</button>
    </h3>
    <div id="{{ identifiant }}-{{ forloop.counter }}" class="accordion-collapse collapse" data-bs-parent="#{{ identifiant }}">
      <div class="accordion-body">{{ question.reponse|linebreaks }}</div>
    </div>
  </div>
  {% endfor %}
</div>
